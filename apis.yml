aid: anine-bing
name: Anine Bing
description: >-
  Anine Bing is a Los Angeles-based contemporary womenswear and fashion brand
  selling apparel, denim, footwear, and accessories direct to consumers through
  its online store at aninebing.com. The storefront runs on Shopify and exposes a
  modern agent-commerce surface: a published /llms.txt and /agents.md, a Universal
  Commerce Protocol (ucp.dev) merchant profile at /.well-known/ucp, and a live UCP
  shopping MCP endpoint for agent-driven catalog search, cart, and buyer-approved
  checkout. Customer authentication is provided by Shopify's Customer Account API
  over OpenID Connect. Originally added to the API Evangelist network as a portfolio
  lead of Index Ventures, this profile has been enriched from the brand's real
  public agent, auth, and discovery surfaces.
