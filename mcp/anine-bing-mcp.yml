server:
  name: anine-bing-ucp-shopping
  description: >-
    Live Universal Commerce Protocol (UCP, ucp.dev) shopping MCP endpoint for the
    Anine Bing Shopify storefront. Enables agent-driven catalog search, cart, and
    buyer-approved checkout. This is Shopify's native UCP MCP surface exposed on the
    brand domain, not a bespoke Anine Bing server.
  transport: http
  url: https://www.aninebing.com/api/ucp/mcp
  alt_url: https://aninebing.myshopify.com/api/ucp/mcp
  protocol: ucp
  ucp_versions:
  - '2026-04-08'
  - '2026-01-23'
  discovery: https://www.aninebing.com/.well-known/ucp
  schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
  notes: >-
    tools/list requires a valid UCP agent profile URI in the request (returns
    error invalid_profile_url / -32001 without one). Checkout requires
    contemporaneous human buyer approval; the endpoint is rate-limited per IP (429).
tools:
# Tool names as documented in the store's /llms.txt "Typical Agent Flow"; exact
# schemas are published at the UCP OpenRPC schema URL above.
- name: search_catalog
  description: Find products matching the buyer's intent across the store catalog.
- name: create_cart
  description: Create a cart and add desired items.
- name: create_checkout
  description: Start the purchase flow for a cart.
- name: update_checkout
  description: Set shipping address and method on an in-progress checkout.
- name: complete_checkout
  description: Finalize the purchase (requires explicit buyer payment approval).
